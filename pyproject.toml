[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-optimizer-lab2"
version = "0.1.0"
description = "LLM inference benchmarking, bottleneck identification, and optimization loop for SGLang and vLLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=2.25",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_optimizer"]
